<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Pesquisa PAI 2026 | CPA</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="top"><div class="top-inner">
  <img class="brand-logo" src="logo-senai-fiems.png" alt="SENAI FIEMS">
  <span class="badge">PAI 2026</span>
</div></header>

<main class="wrap">
  <div class="user-line"><span id="quem"></span><button type="button" id="sair">Sair</button></div>
  <div class="card" id="card"></div>
</main>
<div class="footer">Suas respostas são anônimas e tratadas conforme a LGPD.</div>

<script src="config.js"></script>
<script src="mock-api.js"></script>
<script src="app.js"></script>
<script>
(function () {
  const s = sessao.ler();
  if (!s || !s.token) { location.replace('index.html'); return; }
  const Q = s.questionario;
  const card = document.getElementById('card');
  document.getElementById('quem').textContent = 'Olá, ' + s.nome + (s.curso ? ' · ' + s.curso : '');
  document.getElementById('sair').addEventListener('click', function () { sessao.limpar(); location.href = 'index.html?perfil=' + s.perfil; });

  const LIKERT = [[1, 'Discordo totalmente'], [2, 'Discordo'], [3, 'Neutro'], [4, 'Concordo'], [5, 'Concordo totalmente']];
  let rasc = {};
  try { rasc = JSON.parse(sessionStorage.getItem('cpa_rascunho')) || {}; } catch (e) {}
  const total = Q.secoes.length;
  let passo = rasc._passo || 0;   // 0 = termo; 1..total = seções
  let aceitou = !!rasc._aceitou;

  function salvar() { try { sessionStorage.setItem('cpa_rascunho', JSON.stringify(Object.assign({}, rasc, { _passo: passo, _aceitou: aceitou }))); } catch (e) {} }

  function progresso() {
    return '<div class="step-info"><span>' + (passo === 0 ? 'Termo de ciência' : 'Etapa ' + passo + ' de ' + total) + '</span><span>' +
      Math.round((passo / (total + 0)) * 100) + '%</span></div><div class="progress"><div style="width:' + Math.round(passo / total * 100) + '%"></div></div>';
  }

  function render() {
    window.scrollTo({ top: 0 });
    if (passo === 0) return renderTermo();
    const sec = Q.secoes[passo - 1];
    card.innerHTML = progresso() + '<h2>' + esc(sec.titulo) + '</h2>' + sec.perguntas.map(pergunta).join('') +
      '<div class="msg" id="msg" role="alert"></div>' +
      '<div class="nav"><button class="btn ghost" id="voltar" type="button">Voltar</button>' +
      '<button class="btn" id="prox" type="button">' + (passo === total ? 'Enviar respostas' : 'Continuar') + '</button></div>';

    card.querySelectorAll('input[type=radio]').forEach(function (i) {
      i.addEventListener('change', function () { rasc[i.name] = i.value; i.closest('.q').classList.remove('invalid'); salvar(); });
    });
    card.querySelectorAll('textarea').forEach(function (t) {
      t.addEventListener('input', function () { rasc[t.name] = t.value; salvar(); });
    });
    document.getElementById('voltar').addEventListener('click', function () { passo--; salvar(); render(); });
    document.getElementById('prox').addEventListener('click', proximo);
  }

  function pergunta(q) {
    const v = rasc[q.id];
    let corpo = '';
    if (q.tipo === 'likert') {
      corpo = '<div class="opts">' + LIKERT.map(function (o) { return radio(q.id, o[0], o[1], v); }).join('') +
        '<label class="na">' + radioInner(q.id, 'NA', 'Não sei / não se aplica', v) + '</label></div>';
    } else if (q.tipo === 'nps') {
      let n = ''; for (let i = 0; i <= 10; i++) n += radio(q.id, i, i, v);
      corpo = '<div class="opts nps">' + n + '</div><div class="scale-notes"><span>Nada provável</span><span>Muito provável</span></div>';
    } else {
      corpo = '<textarea class="input" name="' + q.id + '" maxlength="2000">' + esc(v || '') + '</textarea>';
    }
    return '<div class="q" data-id="' + q.id + '" data-req="' + (q.obrigatoria !== false) + '"><p>' + esc(q.texto) +
      (q.obrigatoria !== false ? ' <span style="color:#c62828">*</span>' : '') + '</p>' + corpo + '</div>';
  }
  function radio(id, val, rot, atual) { return '<label>' + radioInner(id, val, rot, atual) + '</label>'; }
  function radioInner(id, val, rot, atual) {
    return '<input type="radio" name="' + id + '" value="' + val + '"' + (String(atual) === String(val) ? ' checked' : '') + '>' + esc(rot);
  }

  function renderTermo() {
    card.innerHTML = progresso() + '<h2>' + esc(Q.titulo) + '</h2>' +
      '<p class="sub">Antes de começar, leia com atenção.</p>' +
      '<div class="termo"><strong>Termo de ciência – tratamento de dados (LGPD)</strong><ul>' +
      '<li>A pesquisa integra o Programa de Avaliação Institucional (PAI) da Comissão Própria de Avaliação (CPA), conforme a Lei nº 10.861/2004 (SINAES).</li>' +
      '<li>Seu login é usado <u>somente</u> para confirmar seu vínculo e registrar que você participou (sem ligar ao conteúdo das respostas).</li>' +
      '<li>As respostas são armazenadas <u>sem identificação pessoal</u>. Os relatórios apresentam apenas dados agrupados, sem exibir grupos muito pequenos.</li>' +
      '<li>A participação é voluntária e pode ser interrompida a qualquer momento. Evite se identificar ou identificar terceiros nos campos de texto.</li>' +
      '<li>Os dados serão usados exclusivamente para fins de autoavaliação institucional e protegidos conforme o Código de Conduta Institucional.</li></ul></div>' +
      '<label class="check"><input type="checkbox" id="aceite"' + (aceitou ? ' checked' : '') + '> Li e concordo em participar da pesquisa.</label>' +
      '<button class="btn" id="iniciar" type="button">Iniciar pesquisa</button><div class="msg" id="msg"></div>';
    document.getElementById('iniciar').addEventListener('click', function () {
      if (!document.getElementById('aceite').checked) { erro('Marque a caixa de concordância para continuar.'); return; }
      aceitou = true; passo = 1; salvar(); render();
    });
  }

  function erro(t) { const m = document.getElementById('msg'); m.className = 'msg err'; m.textContent = t; }

  async function proximo() {
    let primeiro = null;
    card.querySelectorAll('.q').forEach(function (el) {
      if (el.dataset.req !== 'true') return;
      if (rasc[el.dataset.id] === undefined || rasc[el.dataset.id] === '') { el.classList.add('invalid'); primeiro = primeiro || el; }
    });
    if (primeiro) { erro('Responda as perguntas obrigatórias destacadas.'); primeiro.scrollIntoView({ behavior: 'smooth', block: 'center' }); return; }
    if (passo < total) { passo++; salvar(); render(); return; }

    const btn = document.getElementById('prox'); btn.disabled = true; btn.textContent = 'Enviando...';
    const resp = {};
    Q.secoes.forEach(function (sc) { sc.perguntas.forEach(function (q) { if (rasc[q.id] !== undefined) resp[q.id] = rasc[q.id]; }); });
    const r = await api('enviar', { token: s.token, respostas: resp });
    if (r.ok) { sessao.limpar(); return concluido(); }
    btn.disabled = false; btn.textContent = 'Enviar respostas';
    if (r.jaRespondeu) { sessao.limpar(); card.innerHTML = '<div class="done"><div class="big">ℹ️</div><h2>Resposta já registrada</h2><p>' + esc(r.erro) + '</p></div>'; return; }
    erro(r.erro || 'Não foi possível enviar. Tente novamente.');
  }

  function concluido() {
    window.scrollTo({ top: 0 });
    document.getElementById('quem').textContent = '';
    document.getElementById('sair').style.display = 'none';
    card.innerHTML = '<div class="done"><div class="big">🎉</div><h2>Obrigado pela sua participação!</h2>' +
      '<p>Suas respostas foram registradas de forma anônima. Você já pode fechar esta página.</p></div>';
  }

  render();
})();
</script>
</body>
</html>
